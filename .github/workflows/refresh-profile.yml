name: Refresh Profile Cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate cards from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_profile.py
      - name: Commit if changed
        run: |
          git config user.name "Ahmad Raza"
          git config user.email "172101971+Ahmadraza970@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "profile: daily stats refresh"
            git push
          fi
